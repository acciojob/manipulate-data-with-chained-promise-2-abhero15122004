<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chained Promises</title>
</head>
<body>

    <div id="output"></div>

    <script>
        const output = document.getElementById("output");

        function manipulateData() {

            const numbers = [1, 2, 3, 4];

            // Initial Promise
            // Resolves after 3 seconds
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve(numbers);
                }, 3000);
            })

            // First Transformation
            // Filter out odd numbers
            .then((numbers) => {

                const evenNumbers = numbers.filter(
                    number => number % 2 === 0
                );

                // Wait 1 second before displaying
                return new Promise((resolve) => {
                    setTimeout(() => {

                        output.textContent = evenNumbers;

                        resolve(evenNumbers);

                    }, 1000);
                });
            })

            // Second Transformation
            // Multiply even numbers by 2
            .then((evenNumbers) => {

                const multipliedNumbers = evenNumbers.map(
                    number => number * 2
                );

                // Wait 2 seconds before displaying
                return new Promise((resolve) => {
                    setTimeout(() => {

                        output.textContent = multipliedNumbers;

                        resolve(multipliedNumbers);

                    }, 2000);
                });
            });
        }

        // Execute the function
        manipulateData();
    </script>

</body>
</html>
