<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chained Promises</title>
</head>
<body>

    <div id="output"></div>

    <script>
        const output = document.getElementById("output");

        function manipulateData() {

            const numbers = [1, 2, 3, 4];

            // Initial Promise
            // Resolves after 3 seconds
            const initialPromise = new Promise((resolve) => {
                setTimeout(() => {
                    resolve(numbers);
                }, 3000);
            });

            // First transformation
            // Starts immediately and displays after 1 second
            const firstTransformation = new Promise((resolve) => {
                setTimeout(() => {

                    const evenNumbers = numbers.filter(
                        number => number % 2 === 0
                    );

                    output.textContent = evenNumbers;

                    resolve(evenNumbers);

                }, 1000);
            });

            // Second transformation
            // Starts after the first transformation
            firstTransformation
                .then((evenNumbers) => {

                    return new Promise((resolve) => {
                        setTimeout(() => {

                            const multipliedNumbers = evenNumbers.map(
                                number => number * 2
                            );

                            output.textContent = multipliedNumbers;

                            resolve(multipliedNumbers);

                        }, 2000);
                    });

                });

            return initialPromise;
        }

        manipulateData();
    </script>

</body>
</html>
