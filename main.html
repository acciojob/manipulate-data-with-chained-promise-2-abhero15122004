<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chained Promises</title>
</head>
<body>

    <div id="output"></div>

    <script>
        const output = document.getElementById("output");

        function manipulateData() {

            const numbers = [1, 2, 3, 4];

            // Initial Promise - 3 seconds
            const initialPromise = new Promise((resolve) => {
                setTimeout(() => {
                    resolve(numbers);
                }, 3000);
            });

            // Chain the transformations to the initial promise
            initialPromise
                .then((numbers) => {

                    // Filter out odd numbers
                    const evenNumbers = numbers.filter(
                        number => number % 2 === 0
                    );

                    // First transformation delay - 1 second
                    return new Promise((resolve) => {
                        setTimeout(() => {

                            output.textContent = evenNumbers;

                            resolve(evenNumbers);

                        }, 1000);
                    });
                })

                .then((evenNumbers) => {

                    // Multiply even numbers by 2
                    const multipliedNumbers = evenNumbers.map(
                        number => number * 2
                    );

                    // Second transformation delay - 2 seconds
                    return new Promise((resolve) => {
                        setTimeout(() => {

                            output.textContent = multipliedNumbers;

                            resolve(multipliedNumbers);

                        }, 2000);
                    });
                });
        }

        // Execute the function
        manipulateData();
    </script>

</body>
</html>
