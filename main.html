<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chained Promises</title>
</head>
<body>

    <div id="output"></div>

    <script>
        const output = document.getElementById("output");

        function manipulateData() {

            // Initial array
            const numbers = [1, 2, 3, 4];

            // First Promise
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve(numbers);
                }, 1000);
            })

            // First transformation - filter even numbers
            .then((numbers) => {
                const evenNumbers = numbers.filter(number => number % 2 === 0);

                return new Promise((resolve) => {
                    setTimeout(() => {
                        output.textContent = evenNumbers;
                        resolve(evenNumbers);
                    }, 0);
                });
            })

            // Second transformation - multiply by 2
            .then((evenNumbers) => {
                const multipliedNumbers = evenNumbers.map(number => number * 2);

                return new Promise((resolve) => {
                    setTimeout(() => {
                        output.textContent = multipliedNumbers;
                        resolve(multipliedNumbers);
                    }, 2000);
                });
            });
        }

        // Execute the function
        manipulateData();
    </script>

</body>
</html>
